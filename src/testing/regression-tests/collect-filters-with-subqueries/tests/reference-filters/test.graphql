mutation createEdges {
    updateShipment(
        input: {
            id: "@{ids/Shipment/S1}"
            addDeliveries: ["@{ids/Delivery/D1}", "@{ids/Delivery/D2}"]
            addHandlingUnits: ["@{ids/HandlingUnit/H1}"]
        }
    ) {
        shipmentNumber
    }
    s2: updateShipment(
        input: {
            id: "@{ids/Shipment/S2}"
            addDeliveries: ["@{ids/Delivery/D3}"]
            addHandlingUnits: ["@{ids/HandlingUnit/H4}"]
        }
    ) {
        shipmentNumber
    }
    updateOrder(input: { id: "@{ids/Order/O1}", delivery: "@{ids/Delivery/D1}" }) {
        orderNumber
    }
    updateHandlingUnit(
        input: { id: "@{ids/HandlingUnit/H1}", addChildHandlingUnits: ["@{ids/HandlingUnit/H2}"] }
    ) {
        handlingUnitNumber
    }
    h2: updateHandlingUnit(
        input: { id: "@{ids/HandlingUnit/H2}", addChildHandlingUnits: ["@{ids/HandlingUnit/H3}"] }
    ) {
        handlingUnitNumber
    }
    updateArticle(input: { id: "@{ids/Article/A1}", addReplacements: ["@{ids/Article/A2}"] }) {
        articleNumber
    }
}

query reference {
    Shipment(shipmentNumber: "S1") {
        allItems(filter: { article: { isDangerousGoods: true } }) {
            itemNumber
        }
        _allItemsMeta(filter: { article: { isDangerousGoods: true } }) {
            count
        }
    }
}

query referenceInValueObject {
    Shipment(shipmentNumber: "S1") {
        allItems(filter: { packaging: { materialArticle: { description: "Box" } } }) {
            itemNumber
        }
    }
}

query referenceInQuantifier {
    Shipment(shipmentNumber: "S1") {
        allItems(filter: { subItems_some: { article: { isDangerousGoods: true } } }) {
            itemNumber
        }
    }
}

query listInReference {
    Shipment(shipmentNumber: "S1") {
        allItems(filter: { article: { tags_some: { equal: "hazmat" } } }) {
            itemNumber
        }
    }
}

query relationInReference {
    Shipment(shipmentNumber: "S1") {
        allItems(filter: { article: { replacements_some: { articleNumber: "A2" } } }) {
            itemNumber
        }
    }
}

query referenceWithOrderAndPagination {
    Shipment(shipmentNumber: "S1") {
        sorted: allItems(
            filter: { article: { isDangerousGoods: false } }
            orderBy: itemNumber_DESC
        ) {
            itemNumber
        }
        paginated: allItems(
            filter: { article: { isDangerousGoods: false } }
            orderBy: itemNumber_ASC
            skip: 1
            first: 1
        ) {
            itemNumber
        }
    }
}

query twoListSegments {
    Shipment(shipmentNumber: "S1") {
        allSubItems(filter: { article: { description: "Pump" } }) {
            itemNumber
        }
    }
}

query toOneRelation {
    Order(orderNumber: "O1") {
        allItems(filter: { article: { isDangerousGoods: false } }) {
            itemNumber
        }
    }
}
