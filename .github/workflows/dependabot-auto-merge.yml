name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # fails if the PR is not from Dependabot or its commits are not verified as Dependabot's
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      # Adds the PR to the merge queue (or enables auto-merge if there is none). The merge queue
      # re-runs the tests on the PR merged into the latest main before merging.
      # GITHUB_TOKEN cannot add PRs to a merge queue, so AUTO_MERGE_TOKEN (a fine-grained PAT or
      # GitHub App token with contents + pull requests write access, stored as a Dependabot secret)
      # is needed once the queue is enabled.
      # major updates are left for manual review
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
