name: Deploy
run-name: >-
  Deploy · ${{ github.ref_name }}
on:
  push:
    tags:
      - 'v*'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org/
          cache: 'npm'
      - run: npm ci
      # prereleases (v6.0.0-alpha.1) go to "next", stable versions to "latest"
      - run: npm publish --tag "$([[ "$GITHUB_REF_NAME" == *-* ]] && echo next || echo latest)"
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
