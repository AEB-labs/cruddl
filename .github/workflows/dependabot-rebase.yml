name: Dependabot rebase
run-name: Dependabot rebase · ${{ github.sha }}

# The branch ruleset requires PR branches to be up to date with main. Dependabot only rebases on
# conflicts, so after one Dependabot PR merges, the others would wait forever. This asks Dependabot
# to rebase every open PR with auto-merge enabled that fell behind main.
on:
  push:
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      # mergeStateStatus is computed lazily by GitHub and can be UNKNOWN right after a push
      - run: sleep 30

      - name: Ask Dependabot to rebase PRs that are behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --author 'app/dependabot' --state open --json number,mergeStateStatus,autoMergeRequest \
            --jq '.[] | select(.autoMergeRequest != null and .mergeStateStatus == "BEHIND") | .number' |
          while read -r pr; do
            echo "Requesting rebase of #$pr"
            gh pr comment "$pr" --body '@dependabot rebase'
          done
