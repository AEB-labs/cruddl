name: Test
run-name: >-
  Test · ${{ github.event_name == 'pull_request' && format('MR #{0} ({1} → {2})',
  github.event.pull_request.number, github.head_ref, github.base_ref) || format('branch {0}',
  github.ref_name) }}
on:
  pull_request:
  push:
    branches:
      - main
      - 'release/*'
jobs:
  # tests against all supported ArangoDB versions on the default Node.js version
  test-arango:
    name: test-arango (${{ matrix.arango-image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pinned to exact patch versions because the AQL files record the peak memory usage per
        # version - keep in sync with TESTED_ARANGODB_VERSIONS in
        # src/testing/regression-tests/aql-golden-file.ts
        arango-image: ['arangodb:3.12.6', 'arangodb:3.12.11']
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x # default Node.js version, keep in sync with deploy.yml
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
      - run:
          docker run --name arangodb -p 127.0.0.1:8529:8529 -d -e ARANGO_NO_AUTH=1 -e LANG=en_US ${{
          matrix.arango-image }}
      - run: timeout 10 docker logs --follow arangodb || true # wait until arangodb is started
      - run: curl -L http://localhost:8529/_api/version
      - run: npm ci
      - run: npm run knip
      - run: npm run knip:prod
      - run: npm run typecheck
      - run: npm test

  # tests all supported Node.js versions without ArangoDB
  test-node:
    name: test-node (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 25.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:no-arango

  # The jobs above are reported as "test-arango (...)" and "test-node (...)", so a required status
  # check named "test" would never be satisfied. This job reports a stable "test" check that only
  # succeeds if all of them did, so the branch ruleset does not depend on the matrices.
  test-result:
    name: test
    needs: [test-arango, test-node]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.test-arango.result }}" != "success" ] || [ "${{ needs.test-node.result }}" != "success" ]; then
            echo "Jobs finished with results: test-arango=${{ needs.test-arango.result }}, test-node=${{ needs.test-node.result }}"
            exit 1
          fi

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
