name: Test
run-name: >-
  Test · ${{ github.event_name == 'pull_request' && format('MR #{0} ({1} → {2})',
  github.event.pull_request.number, github.head_ref, github.base_ref) || format('branch {0}',
  github.ref_name) }}
on:
  pull_request:
  # the branch ruleset uses a merge queue, which tests the PR merged into the latest main (plus the
  # PRs ahead of it in the queue) before it is actually merged
  merge_group:
  push:
    branches:
      - main
      - 'release/*'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pinned to exact patch versions because the AQL files record the peak memory usage per
        # version - keep in sync with TESTED_ARANGODB_VERSIONS in
        # src/testing/regression-tests/aql-golden-file.ts
        arango-image: ['arangodb:3.12.6', 'arangodb:3.12.11']
        node-version: [20.x, 22.x, 24.x, 25.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run:
          docker run --name arangodb -p 127.0.0.1:8529:8529 -d -e ARANGO_NO_AUTH=1 -e LANG=en_US ${{
          matrix.arango-image }}
      - run: timeout 10 docker logs --follow arangodb || true # wait until arangodb is started
      - run: curl -L http://localhost:8529/_api/version
      - run: npm ci
      - run: npm run knip
      - run: npm run knip:prod
      - run: npm run typecheck
      - run: npm test

  # The matrix jobs above are reported as "test (<arango-image>, <node-version>)", so a required
  # status check named "test" would never be satisfied. This job reports a stable "test" check that
  # only succeeds if all matrix jobs did, so the branch ruleset does not depend on the matrix.
  test-result:
    name: test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Matrix jobs finished with result: ${{ needs.test.result }}"
            exit 1
          fi

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
